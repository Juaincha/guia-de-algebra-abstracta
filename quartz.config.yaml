# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Guía de Álgebra Abstracta"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-TVYFXHZQRG
  locale: es-ES
  baseUrl: juaincha.github.io/guia-de-algebra-abstracta
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Solo necesario con dominio propio: escribe public/CNAME con el host de baseUrl.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # Ordena la barra lateral igual que el indice de cada carpeta.
      # El contentIndex guarda los enlaces de cada pagina en orden de aparicion,
      # asi que el orden de los hijos de una carpeta sale de los wikilinks de su
      # index.md. Lo que el index no enlace cae al final, alfabeticamente.
      # Esta funcion se serializa y se ejecuta en el navegador (ver el atributo
      # data-data-fns del explorer), por eso va como string.
      sortFn: |
        (function () {
          var W = window
          if (!W.__ordenIndice) {
            W.__ordenIndice = {}
            W.__reordenarExplorer = function () {
              var base = (document.body && document.body.dataset.basepath) || ""
              var slugDe = function (li) {
                var f = li.querySelector(":scope > .folder-container")
                if (f) return f.dataset.folderpath || ""
                var a = li.querySelector(":scope > a")
                return a ? a.getAttribute("href").slice(base.length).replace(/^\//, "") : ""
              }
              document
                .querySelectorAll(".explorer-ul, .explorer-content ul.content")
                .forEach(function (ul) {
                  var cab = ul.parentElement && ul.parentElement.previousElementSibling
                  var padre =
                    cab && cab.dataset && cab.dataset.folderpath
                      ? cab.dataset.folderpath.replace(/(^|\/)index$/, "")
                      : ""
                  var fin = ul.querySelector(":scope > .overflow-end")
                  Array.prototype.filter
                    .call(ul.children, function (li) {
                      return li !== fin
                    })
                    .map(function (li, i) {
                      var r = W.__ordenIndice[padre + "|" + slugDe(li)]
                      return { li: li, r: r === undefined ? Infinity : r, i: i }
                    })
                    .sort(function (x, y) {
                      return x.r === y.r ? x.i - y.i : x.r - y.r
                    })
                    .forEach(function (x) {
                      ul.insertBefore(x.li, fin)
                    })
                })
            }
            fetchData.then(function (d) {
              var c = d.content || d
              var m = {}
              Object.keys(c).forEach(function (k) {
                if (!/(^|\/)index$/.test(k)) return
                var padre = k.replace(/(^|\/)index$/, "")
                ;(c[k].links || []).forEach(function (l, i) {
                  m[padre + "|" + l.replace(/\/$/, "/index")] = i
                })
              })
              W.__ordenIndice = m
              // En la primera carga el explorer ya se pinto antes de que este
              // JSON estuviera disponible, asi que hay que reordenar el DOM.
              // Las navegaciones posteriores ya salen ordenadas de esta funcion.
              queueMicrotask(W.__reordenarExplorer)
              setTimeout(W.__reordenarExplorer, 0)
            })
          }
          return function (a, b) {
            var padre = a.slugSegments.slice(0, -1).join("/")
            var ra = W.__ordenIndice[padre + "|" + a.slug]
            var rb = W.__ordenIndice[padre + "|" + b.slug]
            if (ra !== undefined && rb !== undefined) return ra - rb
            if (ra !== undefined) return -1
            if (rb !== undefined) return 1
            if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1
            return (a.displayName || "").localeCompare(b.displayName || "", undefined, {
              numeric: true,
              sensitivity: "base",
            })
          }
        })()
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: Juaincha/guia-de-algebra-abstracta
        repoId: R_kgDOUCH8hA
        category: Comentarios
        categoryId: DIC_kwDOUCH8hM4DEWHf
        # pathname: el hilo se asocia a la ruta de la pagina, no a la URL
        # completa. Sobrevive a un cambio de dominio; se rompe si se mueve
        # el articulo de carpeta. Ver PENDIENTES/CLAUDE.md.
        mapping: pathname
        strict: true
        lang: es
        inputPosition: bottom
        reactionsEnabled: true
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Repositorio: https://github.com/juaincha/guia-de-algebra-abstracta
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
